<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${formTitle}">Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <a th:href="@{/products}">Volver al catálogo</a>
    <h1 class="my-4" th:text="${formTitle}">Producto</h1>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form th:action="${formAction}" method="post" class="col-md-6">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label for="name" class="form-label">Nombre</label>
            <input id="name" name="name" class="form-control" maxlength="255" required
                   th:value="${productName != null ? productName : product.name}">
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Precio (€)</label>
            <input id="price" name="price" type="number" step="0.01" min="0.01" class="form-control" required
                   th:value="${productPrice != null ? productPrice : product.price}">
        </div>
        <button class="btn btn-primary" type="submit">Guardar</button>
        <a class="btn btn-secondary" th:href="@{/products}">Cancelar</a>
    </form>
</main>
</body>
</html>
