<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso de administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-5">
    <div class="col-md-5 mx-auto">
        <h1 class="mb-4">Iniciar sesión</h1>
        <div th:if="${param.error}" class="alert alert-danger">Usuario o contraseña incorrectos.</div>
        <div th:if="${param.logout}" class="alert alert-success">Has cerrado sesión.</div>
        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input id="username" name="username" class="form-control" autocomplete="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary">Entrar</button>
            <a class="btn btn-secondary" th:href="@{/}">Volver</a>
        </form>
    </div>
</main>
</body>
</html>
