<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administración de productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <nav class="d-flex justify-content-between mb-4">
        <a th:href="@{/}">Inicio</a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-outline-secondary btn-sm" type="submit">Cerrar sesión</button>
        </form>
    </nav>
    <h1 class="mb-4">Administración de productos</h1>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div class="d-flex gap-2 mb-3">
        <a class="btn btn-success" th:href="@{/products/add}">Añadir producto</a>
        <a class="btn btn-outline-primary" th:href="@{/admin/export}">Descargar catálogo SQL</a>
        <a class="btn btn-secondary" th:href="@{/products}">Ver catálogo</a>
    </div>
    <p th:if="${#lists.isEmpty(products)}" class="alert alert-info">Aún no hay productos.</p>
    <div class="table-responsive">
        <table class="table align-middle" th:if="${!#lists.isEmpty(products)}">
            <thead><tr><th>Producto</th><th>Precio</th><th>Acciones</th></tr></thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.name}">Producto</td>
                <td><span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</span> €</td>
                <td class="d-flex gap-2">
                    <a class="btn btn-sm btn-warning" th:href="@{/products/edit/{id}(id=${product.id})}">Editar</a>
                    <form th:action="@{/products/delete/{id}(id=${product.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-sm btn-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
