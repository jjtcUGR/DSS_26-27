<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo de productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <nav class="d-flex justify-content-between mb-4">
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/cart}">Ver carrito</a>
    </nav>
    <h1 class="mb-4">Catálogo de productos</h1>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div sec:authorize="hasRole('ADMIN')" class="mb-3">
        <a class="btn btn-success" th:href="@{/products/add}">Añadir producto</a>
        <a class="btn btn-outline-primary" th:href="@{/admin/export}">Exportar catálogo SQL</a>
    </div>
    <div th:if="${#lists.isEmpty(products)}" class="alert alert-info">
        Aún no hay productos. Inicia sesión como administrador para añadirlos.
    </div>
    <div class="row g-3">
        <div class="col-md-4" th:each="product : ${products}">
            <article class="card h-100">
                <div class="card-body">
                    <h2 class="h5 card-title" th:text="${product.name}">Producto</h2>
                    <p class="card-text"><span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</span> €</p>
                    <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-primary" type="submit">Añadir al carrito</button>
                    </form>
                    <div sec:authorize="hasRole('ADMIN')" class="d-flex gap-2 mt-2">
                        <a class="btn btn-sm btn-warning" th:href="@{/products/edit/{id}(id=${product.id})}">Editar</a>
                        <form th:action="@{/products/delete/{id}(id=${product.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-danger" type="submit">Eliminar</button>
                        </form>
                    </div>
                </div>
            </article>
        </div>
    </div>
</main>
</body>
</html>
