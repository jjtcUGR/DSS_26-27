<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrito de la compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <nav class="mb-4"><a th:href="@{/}">Inicio</a></nav>
    <h1 class="mb-4">Carrito de la compra</h1>
    <p th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info">Tu carrito está vacío.</p>
    <ul class="list-group mb-4" th:if="${!#lists.isEmpty(cartItems)}">
        <li class="list-group-item d-flex justify-content-between align-items-center" th:each="product : ${cartItems}">
            <span><span th:text="${product.name}">Producto</span> —
                <span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</span> €</span>
            <form th:action="@{/cart/remove/{id}(id=${product.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-sm btn-danger" type="submit">Eliminar</button>
            </form>
        </li>
    </ul>
    <a class="btn btn-primary" th:href="@{/products}">Continuar comprando</a>
</main>
</body>
</html>
