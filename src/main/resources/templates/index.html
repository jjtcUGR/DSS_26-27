<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrito de la compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-5">
    <h1 class="mb-3">Carrito de la compra</h1>
    <p class="lead">Consulta el catálogo y añade productos a tu carrito.</p>
    <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-primary" th:href="@{/products}">Ver catálogo</a>
        <a class="btn btn-secondary" th:href="@{/cart}">Ver carrito</a>
        <a class="btn btn-outline-dark" th:href="@{/login}">Acceso de administración</a>
    </div>
</main>
</body>
</html>
